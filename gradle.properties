org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.13 officially supports API 35 and lower; API 36 is installed locally
# (platforms android-36 + build-tools 36.1.0) and builds fine. Suppress the
# "unsupported compileSdk" warning so the required compileSdk/targetSdk 36
# does not fail configuration.
android.suppressUnsupportedCompileSdk=36
